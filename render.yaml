# Render Blueprint for the Fat7 3D printing backend.
# Database is Neon (neon.tech) — set DATABASE_URL to the Neon connection string.
# In Render: New + > Blueprint, point it at the repo containing this file.
services:
  - type: web
    name: fat7-3d-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Fat7_3d_printing.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL in the dashboard
      - key: CSRF_TRUSTED_ORIGINS
        sync: false   # set to your Vercel URL in the dashboard
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        sync: false   # paste your Neon pooled connection string (…-pooler…/neondb?sslmode=require)
      # Email — set these as secrets in the dashboard (do not commit values)
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
